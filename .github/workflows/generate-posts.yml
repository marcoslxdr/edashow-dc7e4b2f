name: Generate Daily Posts

# Desativado: pipeline canônico é o Vercel Cron /api/cron/daily-posts
on:
  workflow_dispatch:

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_POST_GENERATION == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "❌ ERROR: SITE_URL secret is not configured!"
            echo "Please add SITE_URL to your repository secrets."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ ERROR: CRON_SECRET secret is not configured!"
            echo "Please add CRON_SECRET to your repository secrets."
            exit 1
          fi
          echo "✅ Secrets validated successfully"
          echo "SITE_URL: $SITE_URL"

      - name: Generate 5 posts
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SUCCESS=0
          ERRORS=0

          for i in 1 2 3 4 5; do
            echo "========================================="
            echo "Generating post $i of 5..."
            echo "========================================="

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$SITE_URL/api/cron/generate-posts" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            echo "Status: $HTTP_CODE"
            echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

            if [ "$HTTP_CODE" = "200" ]; then
              SUCCESS=$((SUCCESS + 1))
            else
              ERRORS=$((ERRORS + 1))
            fi

            echo ""

            # Wait between requests to avoid overload
            if [ "$i" -lt 5 ]; then
              echo "Waiting 10 seconds..."
              sleep 10
            fi
          done

          echo "========================================="
          echo "SUMMARY: $SUCCESS success, $ERRORS errors"
          echo "========================================="

          # Fail the workflow if all posts failed
          if [ "$SUCCESS" -eq 0 ]; then
            echo "All posts failed to generate!"
            exit 1
          fi
